<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .aviso {
            color: red;
            font-size: .5em;
        }
    </style>
</head>
<body>
    <h1>Formulario de reserva</h1>
    <form action="procesa.php" onsubmit="return validarFormulario()" >
        <p>
            <label for="nombre">Nombre y apellidos:</label>
            <input type="text" id="nombre" name="nombre">
            <p id="aviso-nombre" class="aviso"></p>
        </p>

        <p>
            <label for="dias">Días de alojamiento</label>
            <input type="number" id="dias" name="dias">
            <p id="aviso-dias" class="aviso"></p>
        </p>

        <p>
            <label for="fuma">Fumador</label>
            <input type="checkbox" id="fuma" name="fuma">
        </p>

        <p>
            <label for="fecha">Fecha de alojamiento</label>
            <input type="date" id="fecha" name="fecha">
        </p>

        <input type="submit" value="Reservar">

    </form>

    <script>
        function validarFormulario(){
            //****** RESETEAMOS LOS AVISOS*****
            document.getElementById("aviso-nombre").innerHTML = "";
            document.getElementById("aviso-dias").innerHTML = "";

            let nombre = document.getElementById("nombre").value;
            if (nombre.length < 10){
                document.getElementById("aviso-nombre").innerHTML = 
                "El nombre y apellidos tiene que tener al menos 10 caracteres";
                document.getElementById("aviso-nombre").focus();
                return false;
            }

            let dias = document.getElementById("dias").value;
            if (Number (dias) <3){
                document.getElementById("aviso-dias").innerHTML = 
                "Los días de alojamiento no pueden ser menos de 3";
                document.getElementById("aviso-dias").focus();
                return false;
            }

            let fuma = document.getElementById("fuma").checked;
            if (fuma == true){
                alert("No se admiten fumadores");
                return false;
            }

            let fecha = document.getElementById("fecha").value;
            let hoy = new Date();
            alert(hoy);
            let fechaDate = new Date(fecha);

            if (fechaDate < hoy) {
                alert("La fecha de alojamiento no puede ser anterior a hoy");
                document.getElementById("fecha").focus();
                return false;
            }

            alert("Formulario correcto");
            return true;

        }
    </script>
</body>
</html>
